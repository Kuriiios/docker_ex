name:  Continuous Deployment (Docker Push)

on:
  workflow_run:
    workflows: ["CI Quality Check"] # Doit correspondre exactement au 'name' dans ci.yml
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          # On utilise des secrets pour ne pas afficher tes identifiants
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Remplace 'DOCKERHUB_USERNAME' par ton pseudo Docker Hub
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/test:latest, ${{ secrets.DOCKERHUB_USERNAME }}/test:${{ github.sha }}
