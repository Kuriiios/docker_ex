version: '3.12'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: founder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
      POSTGRES_DB: my_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founder -d my_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # FastAPI Service
  api:
    build:
      context: ./docker_ex/app_api
      dockerfile: Dockerfile
    container_name: fastapi_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://founder:${DB_PASSWORD:-password123}@db:5432/my_database
    ports:
      - "${FASTAPI_PORT}:8000"
    volumes:
      - ./docker_ex/app_api:/app        # Mount code
      - /app/.venv
    networks:
      - app_network

  # Streamlit Service
  frontend:
    build:
      context: ./docker_ex/app_front
      dockerfile: Dockerfile
    container_name: streamlit_front
    ports:
      - "${STREAMLIT_PORT}:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./docker_ex/app_front:/app
      - /app/.venv
    networks:
      - app_network

volumes:
  postgres_data:
networks:
  app_network:
     